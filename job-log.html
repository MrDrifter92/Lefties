<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lefties OS - Job Log</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #111827;
      color: #e0e0e0;
      padding: 20px;
    }
    h1 {
      color: #0071B6;
    }
    .field {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: 'Nunito', sans-serif;
    }
    button {
      background-color: #0071B6;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: bold;
      font-size: 16px;
    }
    button:hover {
      background-color: #005a91;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      background-color: #005a91;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
    .back-btn:hover {
      background-color: #004a78;
    }
    .job-log-section {
      background-color: #1f2937;
      padding: 20px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .pdf-report {
      background-color: white;
      color: black;
      padding: 20px;
      font-family: 'Nunito', sans-serif;
    }
    .pdf-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .pdf-header img {
      max-height: 80px;
    }
  </style>
</head>
<body>

  <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>

  <h1>Job Log</h1>
  <p>Fill out the details below to generate a client-ready report and PDF.</p>

  <div class="job-log-section">
    <div class="field">
      <label for="clientNameField">Client Name</label>
      <input id="clientNameField" type="text" placeholder="Enter client name">
    </div>

    <div class="field">
      <label for="serviceAddressField">Service Address</label>
      <input id="serviceAddressField" type="text" placeholder="Enter service address">
    </div>

    <div class="field">
      <label for="jobDateField">Date & Time Completed</label>
      <input id="jobDateField" type="text" placeholder="e.g. 14 Aug 2025 - 2:30 PM">
    </div>

    <div class="field">
      <label for="technicianField">Technician Name</label>
      <input id="technicianField" type="text" placeholder="Enter technician name">
    </div>

    <div class="field">
      <label for="servicesField">Services Completed</label>
      <input id="servicesField" type="text" placeholder="e.g. Carpet Revival, Upholstery Cleaning">
    </div>

    <div class="field">
      <label for="notesField">Technician Notes</label>
      <textarea id="notesField" placeholder="Enter notes here"></textarea>
    </div>

    <div class="field">
      <label for="beforePhotoField">Before Photo URL</label>
      <input id="beforePhotoField" type="text" placeholder="Paste link to before photo">
    </div>

    <div class="field">
      <label for="afterPhotoField">After Photo URL</label>
      <input id="afterPhotoField" type="text" placeholder="Paste link to after photo">
    </div>

    <button id="generateReportBtn">Generate Job Report</button>
  </div>

  <script>
    document.getElementById("generateReportBtn").addEventListener("click", function () {
      const client = document.getElementById("clientNameField").value;
      const address = document.getElementById("serviceAddressField").value;
      const date = document.getElementById("jobDateField").value;
      const tech = document.getElementById("technicianField").value;
      const services = document.getElementById("servicesField").value;
      const notes = document.getElementById("notesField").value;
      const before = document.getElementById("beforePhotoField").value;
      const after = document.getElementById("afterPhotoField").value;

      if (!client || !address || !date || !tech) {
        alert("Please fill in at least Client, Address, Date, and Technician before generating report.");
        return;
      }

      // 1. Open HTML Report
      const reportUrl = `https://leftiesservices.com.au/reports/job-completion.html?client=${encodeURIComponent(client)}&address=${encodeURIComponent(address)}&date=${encodeURIComponent(date)}&tech=${encodeURIComponent(tech)}&services=${encodeURIComponent(services)}&notes=${encodeURIComponent(notes)}&before=${encodeURIComponent(before)}&after=${encodeURIComponent(after)}`;
      window.open(reportUrl, '_blank');

      // 2. Generate PDF
      const pdfContent = `
        <div class="pdf-report">
          <div class="pdf-header">
            <img src="core-logo.png" alt="Lefties Logo">
            <h2>Job Completion Report</h2>
          </div>
          <p><strong>Client Name:</strong> ${client}</p>
          <p><strong>Service Address:</strong> ${address}</p>
          <p><strong>Date & Time Completed:</strong> ${date}</p>
          <p><strong>Technician:</strong> ${tech}</p>
          <p><strong>Services Completed:</strong> ${services}</p>
          <p><strong>Notes:</strong> ${notes}</p>
          ${before ? `<p><strong>Before Photo:</strong><br><img src="${before}" style="max-width:100%;"></p>` : ''}
          ${after ? `<p><strong>After Photo:</strong><br><img src="${after}" style="max-width:100%;"></p>` : ''}
        </div>
      `;

      const opt = {
        margin: 10,
        filename: `Job-Report-${client.replace(/\s+/g, "_")}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().from(pdfContent).set(opt).save();
    });
  </script>

</body>
</html>
