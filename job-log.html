<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Log | Lefties</title>
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root { --brand-blue:#007186; }
    body { font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; }
  </style>
</head>
<body class="bg-[#0f172a] text-white">
  <main class="max-w-3xl mx-auto px-4 py-8">
    <header class="flex items-center justify-between mb-4">
      <a href="/dashboard.html" class="text-sm text-gray-300 hover:text-white">&larr; Back to Dashboard</a>
      <span class="text-gray-300 text-sm">Lefties • Hervey Bay</span>
    </header>

    <h1 class="text-2xl md:text-3xl font-extrabold mb-6">Job Log</h1>

    <!-- Log form -->
    <section class="space-y-3 mb-6">
      <input id="jl_client" type="text" placeholder="Client name"
             class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10" />
      <input id="jl_address" type="text" placeholder="Job address"
             class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10" />
      <input id="jl_date" type="date"
             class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10" />
      <textarea id="jl_notes" placeholder="Notes"
                class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 h-28"></textarea>

      <div class="flex flex-wrap gap-3">
        <button id="jl_save" class="px-5 py-3 rounded-xl font-extrabold bg-[var(--brand-blue)] hover:bg-white hover:text-[var(--brand-blue)] transition">
          Save to Local Log
        </button>
        <button id="jl_export" class="px-5 py-3 rounded-xl font-extrabold border border-white/10 hover:bg-white/5">
          Export CSV
        </button>
        <button id="jl_clear_form" class="px-5 py-3 rounded-xl font-extrabold border border-white/10 hover:bg-white/5">
          Clear Form
        </button>
      </div>
      <p class="text-gray-400 text-sm">Local only — nothing uploads. Export CSV when you want a copy.</p>
    </section>

    <!-- Log list -->
    <section class="mt-8">
      <h2 class="text-xl font-extrabold mb-3">Saved Jobs (on this device)</h2>
      <div id="jl_list" class="grid gap-2"></div>
    </section>
  </main>

  <script>
  // Prefill from Job Completion
  (function prefill(){
    try {
      const raw = localStorage.getItem('lefties_last_job');
      if (!raw) return;
      const data = JSON.parse(raw);
      const fClient = document.getElementById('jl_client');
      const fAddr   = document.getElementById('jl_address');
      const fNotes  = document.getElementById('jl_notes');
      const fDate   = document.getElementById('jl_date');

      if (fClient && data.client)  fClient.value = data.client;
      if (fAddr   && data.address) fAddr.value   = data.address;
      if (fNotes  && data.notes)   fNotes.value  = data.notes;
      if (fDate   && data.when)    fDate.value   = data.when.split('T')[0];

      // Clear after prefill so nothing lingers
      localStorage.removeItem('lefties_last_job');
    } catch (_) {}
  })();

  // Local Log
  (function log(){
    const key = 'lefties_log';
    const listEl = document.getElementById('jl_list');
    const btnSave = document.getElementById('jl_save');
    const btnExport = document.getElementById('jl_export');
    const btnClearForm = document.getElementById('jl_clear_form');

    const fClient = document.getElementById('jl_client');
    const fAddr   = document.getElementById('jl_address');
    const fDate   = document.getElementById('jl_date');
    const fNotes  = document.getElementById('jl_notes');

    function load(){ try{ return JSON.parse(localStorage.getItem(key)) || []; }catch{ return []; } }
    function save(list){ localStorage.setItem(key, JSON.stringify(list)); }
    function render(){
      const list = load();
      listEl.innerHTML = '';
      if (!list.length) {
        listEl.innerHTML = '<div class="text-gray-400 text-sm">No jobs saved on this device yet.</div>';
        return;
      }
      list.slice().reverse().forEach((item, idxRev) => {
        const i = list.length - 1 - idxRev;
        const row = document.createElement('div');
        row.className = 'bg-white/5 border border-white/10 rounded-lg p-3 flex items-start justify-between gap-3';
        row.innerHTML = `
          <div>
            <div class="font-bold">${item.client || '(No name)'} — <span class="text-gray-300">${item.date || ''}</span></div>
            <div class="text-sm text-gray-300">${item.address || ''}</div>
            ${item.notes ? `<div class="text-sm text-gray-400 mt-1">${item.notes}</div>` : ''}
          </div>
          <div class="flex gap-2">
            <button data-i="${i}" class="px-3 py-2 rounded bg-white/10 hover:bg-white/20 border border-white/10 jl-del">Delete</button>
          </div>
        `;
        row.querySelector('.jl-del').onclick = () => {
          const list = load();
          list.splice(i,1); save(list); render();
        };
        listEl.appendChild(row);
      });
    }

    btnSave.onclick = () => {
      const item = {
        client: fClient.value.trim(),
        address: fAddr.value.trim(),
        date: fDate.value,
        notes: fNotes.value.trim(),
        ts: Date.now()
      };
      const list = load();
      list.push(item); save(list); render();
      alert('Saved to local log.');
    };

    btnExport.onclick = () => {
      const list = load();
      const header = ['Client','Address','Date','Notes'];
      const rows = list.map(j => [
        (j.client||'').replaceAll('"','""'),
        (j.address||'').replaceAll('"','""'),
        (j.date||'').replaceAll('"','""'),
        (j.notes||'').replaceAll('"','""')
      ]);
      const csv = [header].concat(rows).map(r => r.map(v => `"${v}"`).join(',')).join('\n');
      const blob = new Blob([csv], {type:'text/csv'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Lefties-Job-Log-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    };

    btnClearForm.onclick = () => {
      fClient.value=''; fAddr.value=''; fDate.value=''; fNotes.value='';
    };

    render();
  })();
  </script>
</body>
</html>
