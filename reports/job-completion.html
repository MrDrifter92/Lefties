<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lefties — Job Completion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{ --brand:#007186; }
    body{ font-family:'Nunito',sans-serif; background:#0D1117; color:#e5e7eb; }
    .panel{ background:linear-gradient(145deg, rgba(30,41,59,.2), rgba(17,24,39,.4)); border:1px solid rgba(255,255,255,.12); border-radius:16px; backdrop-filter:blur(12px); }
    .btn{ background:linear-gradient(145deg, rgba(0,113,134,.65), rgba(0,88,120,.9)); border:1px solid rgba(0,140,255,.3); border-radius:9999px; padding:.9rem 1.2rem; font-weight:800; }
    .chip{ display:inline-block; padding:.35rem .6rem; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:9999px; margin:.2rem .25rem 0 0; }
    table th, table td{ border-bottom:1px solid rgba(255,255,255,.08); }
  </style>
</head>
<body class="p-4 md:p-8">
  <header class="mb-6 flex items-center justify-between">
    <a href="/dashboard.html" class="text-sm underline opacity-80">← Dashboard</a>
    <h1 class="text-2xl md:text-3xl font-extrabold">Job Completion</h1>
    <a href="/field.os.html" class="text-sm underline opacity-80">↺ Edit in Field OS</a>
  </header>

  <main class="grid gap-6 max-w-5xl">
    <!-- Summary -->
    <section class="panel p-5 md:p-6">
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <h2 class="font-extrabold text-xl">Client</h2>
          <p id="jc_client" class="text-blue-200/90 font-bold"></p>
          <div id="jc_contact" class="text-sm opacity-80"></div>
        </div>
        <div>
          <h2 class="font-extrabold text-xl">Job</h2>
          <div id="jc_jobmeta" class="text-sm opacity-80"></div>
        </div>
      </div>
      <div class="mt-4">
        <h3 class="font-extrabold">Address</h3>
        <p id="jc_address"></p>
      </div>
      <div class="mt-4">
        <h3 class="font-extrabold">Services</h3>
        <div id="jc_services"></div>
      </div>
    </section>

    <!-- Line items + totals -->
    <section class="panel p-5 md:p-6">
      <h2 class="font-extrabold text-xl mb-3">Work Summary</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="opacity-70">
            <tr><th class="text-left p-2">Item</th><th class="text-right p-2">Qty</th><th class="text-right p-2">Price</th></tr>
          </thead>
          <tbody id="jc_lineitems"></tbody>
          <tfoot>
            <tr><td></td><td class="text-right p-2 font-extrabold">Subtotal</td><td id="jc_subtotal" class="text-right p-2"></td></tr>
            <tr><td></td><td class="text-right p-2 font-extrabold">Total</td><td id="jc_total" class="text-right p-2 text-blue-300"></td></tr>
          </tfoot>
        </table>
      </div>
    </section>

    <!-- Client-facing notes -->
    <section class="panel p-5 md:p-6">
      <h2 class="font-extrabold text-xl mb-2">Notes for Client</h2>
      <p id="jc_notes" class="whitespace-pre-wrap"></p>
    </section>

    <!-- Photos -->
    <section class="panel p-5 md:p-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-extrabold text-xl">Photos</h2>
        <div class="flex items-center gap-2">
          <input id="jc_file" type="file" accept="image/*" capture="environment" multiple class="hidden">
          <button id="jc_add" class="btn">Add from Camera / Roll</button>
          <button id="jc_clear" class="btn">Clear</button>
        </div>
      </div>
      <div id="jc_preview" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    </section>

    <!-- Actions -->
    <section class="panel p-5 md:p-6 grid gap-3 md:grid-cols-2">
      <button id="jc_open_shareable" class="btn">Generate Report (Open Shareable Link)</button>
      <button id="jc_reset" class="btn">Reset for Next Client</button>
      <p class="text-xs opacity-70 md:col-span-2">On iPhone: Share → <em>Options</em> → <strong>PDF</strong> → choose Messages/Mail.</p>
    </section>
  </main>

  <script>
    // ========== LOAD FOS DATA ==========
    const $ = sel => document.querySelector(sel);
    let fos={}; try{ fos = JSON.parse(localStorage.getItem('lefties_fos_draft')||"{}"); }catch{}
    function fmtMoney(v){ if(v==null||v==='') return ''; const n=parseFloat(String(v).replace(/[^\d.]/g,'')); return isNaN(n)?String(v):('$'+n.toFixed(2)); }

    function hydrate(){
      $('#jc_client').textContent = fos.client || '—';
      $('#jc_contact').innerHTML = [fos.phone?`📞 ${fos.phone}`:'', fos.email?`&nbsp;&nbsp;✉️ ${fos.email}`:''].filter(Boolean).join(' ');
      $('#jc_jobmeta').innerHTML  = [fos.ref?`Ref: <b>${fos.ref}</b>`:'', fos.date?`Date: <b>${fos.date}</b>`:''].filter(Boolean).join(' &nbsp;&nbsp; ');
      $('#jc_address').textContent= fos.address || '—';
      $('#jc_services').innerHTML = (fos.services||[]).map(s=>`<span class="chip">${s}</span>`).join('') || '<span class="opacity-60">No services listed</span>';
      const body = (fos.lineitems||[]).map(li=>`<tr><td class="p-2">${li.item||''}</td><td class="p-2 text-right">${li.qty||''}</td><td class="p-2 text-right">${fmtMoney(li.price||'')}</td></tr>`).join('');
      $('#jc_lineitems').innerHTML = body || `<tr><td class="p-2 opacity-60" colspan="3">No line items.</td></tr>`;
      $('#jc_subtotal').textContent= fmtMoney(fos.subtotal||'');
      $('#jc_total').textContent   = fmtMoney(fos.total||'');
      $('#jc_notes').textContent   = fos.notes_client || '';
    }
    hydrate();

    // ========== PHOTOS ==========
    const input = $('#jc_file'), preview=$('#jc_preview');
    let files=[];

    function renderPhotos(){
      preview.innerHTML=''; files.forEach((file,i)=> {
        const url=URL.createObjectURL(file);
        const cell=document.createElement('div');
        cell.className='relative rounded-lg overflow-hidden border border-white/10';
        cell.innerHTML=`<img src="${url}" class="w-full h-28 object-cover"><button class="absolute top-1 right-1 bg-black/60 text-white text-xs px-2 py-1 rounded">Remove</button>`;
        cell.querySelector('button').onclick=()=>{ files.splice(i,1); renderPhotos(); };
        preview.appendChild(cell);
      });
    }
    input.addEventListener('change', e=>{ files=files.concat(Array.from(e.target.files||[])); renderPhotos(); });
    $('#jc_add').addEventListener('click', ()=> input.click());
    $('#jc_clear').addEventListener('click', ()=>{ files=[]; input.value=''; renderPhotos(); });

    // compress imgs → dataURLs for shareable page (kept on device only)
    function compressToDataURL(file, maxW=1600,maxH=1600,q=.82){
      return new Promise(resolve=>{
        const img=new Image(), url=URL.createObjectURL(file);
        img.onload=()=>{
          let w=img.width,h=img.height; const r=Math.min(maxW/w,maxH/h,1); w=Math.round(w*r); h=Math.round(h*r);
          const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',q));
        }; img.src=url;
      });
    }

    // ========== OPEN SHAREABLE LINK ==========
    $('#jc_open_shareable').addEventListener('click', async ()=>{
      // store payload + images locally for the shareable renderer to read
      localStorage.setItem('lefties_fos_final', JSON.stringify(fos||{}));
      if (files.length){
        const dataUrls=[]; for (let f of files){ dataUrls.push(await compressToDataURL(f)); }
        localStorage.setItem('lefties_jc_photos', JSON.stringify(dataUrls));
      } else {
        localStorage.removeItem('lefties_jc_photos');
      }
      // open the printable / shareable page
      location.href = '/reports/shareable.html?from=jc';
    });

    // Reset
    $('#jc_reset').addEventListener('click', ()=>{
      localStorage.removeItem('lefties_fos_draft');
      localStorage.removeItem('lefties_jc_photos');
      alert('Cleared. Ready for next job.'); location.href='/field.os.html';
    });
  </script>
</body>
</html>
