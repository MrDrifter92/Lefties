<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services | Lefties Carpet Cleaning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #0071B6;
      --glass-glow: rgba(0, 113, 182, 0.3);
      --text-main: #e0e0e0;
      --bg-dark: #0f172a;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      position: relative;
    }
    .body-video-background {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -2;
      object-fit: cover;
      opacity: 0.25;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }
    .hamburger-icon {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 2rem;
      height: 1.5rem;
      cursor: pointer;
      transition: all .3s ease-in-out;
      position: relative;
      z-index: 20;
    }
    .hamburger-icon span {
      height: 2px;
      width: 100%;
      background: #fff;
      border-radius: 9999px;
      transition: all .3s ease-in-out;
    }
    .hamburger-icon.open span:nth-child(1) {
      transform: rotate(45deg) translate(5px,5px);
    }
    .hamburger-icon.open span:nth-child(2) {
      opacity: 0;
    }
    .hamburger-icon.open span:nth-child(3) {
      transform: rotate(-45deg) translate(5px,-5px);
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: .5rem;
    }
    header nav {
      background: rgba(30,41,59,.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 1.5rem;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 10px 28px rgba(0,0,0,.4);
      max-width: 80rem;
      margin: 0 auto;
      padding: .5rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      min-height: 80px;
    }
    main {
      padding-top: 120px;
      position: relative;
      z-index: 1;
    }
    .mobile-menu {
      position: fixed;
      top: 0; right: -100%;
      width: 80%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: -4px 0 8px rgba(0,0,0,0.3);
      transition: right 0.3s ease-in-out;
      padding: 4rem 2rem;
      z-index: 90;
    }
    .mobile-menu.open {
      right: 0;
    }
    .mobile-menu a {
      display: block;
      margin-bottom: 1.5rem;
      font-size: 1.25rem;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body class="antialiased">

  <video autoplay loop muted playsinline class="body-video-background">
    <source src="services.video.mp4" type="video/mp4">
  </video>

  <header>
    <nav>
      <a href="index.html">
        <img src="core-logo-transparent.png" alt="Lefties Logo" class="h-12 w-auto">
      </a>
      <div class="hidden md:flex space-x-6">
        <a href="index.html">Home</a>
        <a href="upholstery-services.html">Upholstery and Lounges</a>
        <a href="stain-odour.html">Stain and Odour</a>
        <a href="rug-mattresses.html">Rug and Mattresses</a>
        <a href="commercial.html">Commercial</a>
        <a href="contact.html">Contact Us</a>
      </div>
      <button id="mobile-menu-button" class="md:hidden">
        <div id="hamburger-icon" class="hamburger-icon">
          <span></span><span></span><span></span>
        </div>
      </button>
    </nav>
  </header>

  <div id="mobile-menu" class="mobile-menu">
    <a href="index.html">Home</a>
    <a href="upholstery-services.html">Upholstery and Lounges</a>
    <a href="stain-odour.html">Stain and Odour</a>
    <a href="rug-mattresses.html">Rug and Mattresses</a>
    <a href="commercial.html">Commercial</a>
    <a href="contact.html">Contact Us</a>
  </div>

  <main>
    <section class="text-center">
      <h1 class="text-4xl font-bold">Our Services</h1>
      <p class="mt-4">Your existing services content remains untouched here...</p>
    </section>
  </main>

  <script>
    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    const hamburgerIcon = document.getElementById('hamburger-icon');

    mobileMenuButton.addEventListener('click', () => {
      mobileMenu.classList.toggle('open');
      hamburgerIcon.classList.toggle('open');
    });
  </script>

</body>
</html>
