<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services | Lefties Carpet Cleaning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #0071B6;
      --glass-glow: rgba(0, 113, 182, 0.3);
      --text-main: #e0e0e0;
      --bg-dark: #0f172a;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }
    .mobile-menu {
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }
    .mobile-menu.open {
      transform: translateX(0);
    }
  </style>
</head>
<body class="bg-gray-900">

<header class="fixed w-full z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <a href="index.html" class="flex items-center">
        <img src="core-logo-transparent.png" alt="Lefties Carpet Cleaning" class="h-10">
      </a>
      <nav class="hidden md:flex space-x-8 text-white font-semibold">
        <a href="index.html" class="hover:text-blue-400">Home</a>
        <a href="upholstery-cleaning.html" class="hover:text-blue-400">Upholstery and Lounges</a>
        <a href="stain-treatment.html" class="hover:text-blue-400">Stain and Odour</a>
        <a href="rugs-mattresses.html" class="hover:text-blue-400">Rug and Mattresses</a>
        <a href="commercial.html" class="hover:text-blue-400">Commercial</a>
        <a href="contact.html" class="hover:text-blue-400">Contact Us</a>
      </nav>
      <div class="md:hidden flex items-center">
        <button id="menu-btn" class="text-white focus:outline-none">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>

<div id="mobile-menu" class="mobile-menu fixed top-0 right-0 w-64 h-full bg-gray-800 z-50 p-6">
  <button id="close-btn" class="text-white mb-6">
    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
  <nav class="flex flex-col space-y-4">
    <a href="index.html" class="hover:text-blue-400">Home</a>
    <a href="upholstery-cleaning.html" class="hover:text-blue-400">Upholstery and Lounges</a>
    <a href="stain-treatment.html" class="hover:text-blue-400">Stain and Odour</a>
    <a href="rugs-mattresses.html" class="hover:text-blue-400">Rug and Mattresses</a>
    <a href="commercial.html" class="hover:text-blue-400">Commercial</a>
    <a href="contact.html" class="hover:text-blue-400">Contact Us</a>
  </nav>
</div>

<main class="pt-20">
  <!-- Keep your current services page content here exactly as is -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <!-- Existing Services Page Content -->
    <h1 class="text-4xl font-bold mb-8 text-center">Our Services</h1>
    <p class="text-lg text-gray-300 text-center mb-12">Your existing services content remains untouched here...</p>
  </section>
</main>

<script>
  const menuBtn = document.getElementById('menu-btn');
  const closeBtn = document.getElementById('close-btn');
  const mobileMenu = document.getElementById('mobile-menu');

  menuBtn.addEventListener('click', () => {
    mobileMenu.classList.add('open');
  });

  closeBtn.addEventListener('click', () => {
    mobileMenu.classList.remove('open');
  });
</script>

</body>
</html>
