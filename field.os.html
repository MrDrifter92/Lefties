<!-- =========================
     JOB COMPLETION (embedded)
     ========================= -->
<section id="job-completion" class="mt-10">
  <div class="rounded-2xl border border-white/10 bg-white/5 p-5 md:p-6">
    <div class="flex items-center justify-between gap-3 mb-2">
      <h2 class="text-2xl md:text-3xl font-extrabold">Job Completion</h2>
      <button id="fos_gc_reset" class="px-4 py-2 rounded-full font-extrabold border border-white/15 bg-white/10">
        Reset for Next Job
      </button>
    </div>
    <p class="text-sm opacity-70 mb-4">This section auto-fills from Field OS. Tweak anything here, add photos, then generate the client report.</p>

    <!-- Summary -->
    <div class="grid md:grid-cols-2 gap-4">
      <div class="rounded-xl border border-white/10 bg-black/10 p-4">
        <div class="text-sm opacity-70 font-bold">Client</div>
        <input id="gc_client" class="w-full mt-1 px-3 py-2 rounded-lg bg-white/10 border border-white/15" placeholder="Client name">
        <div class="grid grid-cols-2 gap-2 mt-2">
          <input id="gc_phone" class="px-3 py-2 rounded-lg bg-white/10 border border-white/15" placeholder="Phone">
          <input id="gc_email" class="px-3 py-2 rounded-lg bg-white/10 border border-white/15" placeholder="Email">
        </div>
      </div>
      <div class="rounded-xl border border-white/10 bg-black/10 p-4">
        <div class="text-sm opacity-70 font-bold">Job</div>
        <div class="grid grid-cols-2 gap-2 mt-1">
          <input id="gc_ref" class="px-3 py-2 rounded-lg bg-white/10 border border-white/15" placeholder="Ref / Invoice #">
          <input id="gc_date" class="px-3 py-2 rounded-lg bg-white/10 border border-white/15" placeholder="Date">
        </div>
        <input id="gc_address" class="w-full mt-2 px-3 py-2 rounded-lg bg-white/10 border border-white/15" placeholder="Address">
      </div>
    </div>

    <!-- Services -->
    <div class="rounded-xl border border-white/10 bg-black/10 p-4 mt-4">
      <div class="text-sm opacity-70 font-bold mb-1">Services (comma separated)</div>
      <input id="gc_services" class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/15" placeholder="Carpet (2 rooms), Lounge (3 seater), Stain treatment">
    </div>

    <!-- Line items -->
    <div class="rounded-xl border border-white/10 bg-black/10 p-4 mt-4">
      <div class="flex items-center justify-between">
        <div class="font-extrabold">Work Summary</div>
        <button id="gc_add_row" class="px-3 py-2 rounded-full border border-white/15 bg-white/10 text-sm font-bold">+ Add item</button>
      </div>
      <div class="overflow-x-auto mt-3">
        <table class="w-full text-sm">
          <thead class="opacity-70">
            <tr><th class="text-left p-2">Item</th><th class="text-right p-2">Qty</th><th class="text-right p-2">Price</th><th class="p-2"></th></tr>
          </thead>
          <tbody id="gc_lines"></tbody>
          <tfoot>
            <tr><td></td><td class="text-right p-2 font-extrabold">Subtotal</td><td id="gc_sub" class="text-right p-2"></td><td></td></tr>
            <tr><td></td><td class="text-right p-2 font-extrabold">Total</td><td id="gc_tot" class="text-right p-2 text-blue-300"></td><td></td></tr>
          </tfoot>
        </table>
      </div>
    </div>

    <!-- Client notes -->
    <div class="rounded-xl border border-white/10 bg-black/10 p-4 mt-4">
      <div class="text-sm opacity-70 font-bold mb-1">Notes for Client</div>
      <textarea id="gc_notes" rows="4" class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/15" placeholder="Any care notes, risks, or advice you want the client to have."></textarea>
    </div>

    <!-- Photos -->
    <div class="rounded-xl border border-white/10 bg-black/10 p-4 mt-4">
      <div class="flex items-center justify-between mb-3">
        <div class="font-extrabold">Photos</div>
        <div class="flex items-center gap-2">
          <input id="gc_file" type="file" accept="image/*" capture="environment" multiple class="hidden">
          <button id="gc_add" class="px-4 py-2 rounded-full font-extrabold border border-white/15 bg-white/10">Add from Camera / Roll</button>
          <button id="gc_clear" class="px-4 py-2 rounded-full font-extrabold border border-white/15 bg-white/10">Clear</button>
        </div>
      </div>
      <div id="gc_preview" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    </div>

    <!-- Actions -->
    <div class="grid md:grid-cols-2 gap-3 mt-5">
      <button id="gc_generate" class="px-5 py-3 rounded-full font-extrabold border border-white/20 bg-[rgba(0,113,134,.65)]">Generate Report (opens share link)</button>
      <a href="/reports/shareable.html" class="px-5 py-3 rounded-full text-center font-extrabold border border-white/15 bg-white/10">Open last report</a>
      <p class="text-xs opacity-70 md:col-span-2">iPhone: Share → <em>Options</em> → <strong>PDF</strong> → send.</p>
    </div>
  </div>
</section>

<script>
/* ========= Field OS → Embedded Job Completion ========= */
(() => {
  const $ = s => document.querySelector(s);
  const money = v => {
    if (v==null || v==='') return '';
    const n = parseFloat(String(v).replace(/[^\d.]/g,''));
    return isNaN(n) ? String(v) : ('$' + n.toFixed(2));
  };
  const readDraft = () => { try { return JSON.parse(localStorage.getItem('lefties_fos_draft')||'{}'); } catch { return {}; } };
  const writeDraft = (obj) => localStorage.setItem('lefties_fos_draft', JSON.stringify(obj||{}));

  // UI refs
  const ui = {
    client:  $('#gc_client'),
    phone:   $('#gc_phone'),
    email:   $('#gc_email'),
    ref:     $('#gc_ref'),
    date:    $('#gc_date'),
    address: $('#gc_address'),
    services:$('#gc_services'),
    linesT:  $('#gc_lines'),
    sub:     $('#gc_sub'),
    tot:     $('#gc_tot'),
    notes:   $('#gc_notes'),
    file:    $('#gc_file'),
    add:     $('#gc_add'),
    clear:   $('#gc_clear'),
    preview: $('#gc_preview'),
    addRow:  $('#gc_add_row'),
    gen:     $('#gc_generate'),
    reset:   $('#fos_gc_reset')
  };

  // hydrate from draft
  function hydrate(){
    const d = readDraft();
    ui.client.value  = d.client || '';
    ui.phone.value   = d.phone  || '';
    ui.email.value   = d.email  || '';
    ui.ref.value     = d.ref    || '';
    ui.date.value    = d.date   || '';
    ui.address.value = d.address|| '';
    ui.services.value= (d.services||[]).join(', ');
    ui.notes.value   = d.notes_client || '';

    // line items
    ui.linesT.innerHTML = '';
    (d.lineitems||[]).forEach(addRow);
    calcTotals();
  }

  function collect(){
    const d = readDraft();
    d.client = ui.client.value.trim();
    d.phone  = ui.phone.value.trim();
    d.email  = ui.email.value.trim();
    d.ref    = ui.ref.value.trim();
    d.date   = ui.date.value.trim();
    d.address= ui.address.value.trim();
    d.services = ui.services.value.split(',').map(s=>s.trim()).filter(Boolean);
    d.notes_client = ui.notes.value;
    d.lineitems = Array.from(ui.linesT.querySelectorAll('tr')).map(tr=>{
      const [item, qty, price] = tr.querySelectorAll('input');
      return { item:item.value, qty:qty.value, price:price.value };
    });
    d.subtotal = ui.sub.textContent;
    d.total    = ui.tot.textContent;
    writeDraft(d);
    return d;
  }

  function addRow(li={item:'',qty:'',price:''}){
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="p-2"><input class="w-full px-2 py-1 rounded bg-white/10 border border-white/15" value="${li.item||''}" placeholder="Item"></td>
      <td class="p-2 text-right"><input class="w-24 px-2 py-1 rounded bg-white/10 border border-white/15 text-right" value="${li.qty||''}" placeholder="1"></td>
      <td class="p-2 text-right"><input class="w-28 px-2 py-1 rounded bg-white/10 border border-white/15 text-right" value="${li.price||''}" placeholder="$0.00"></td>
      <td class="p-2 text-right"><button class="px-2 py-1 text-xs rounded border border-white/20 bg-white/10">Remove</button></td>`;
    tr.querySelector('button').onclick = () => { tr.remove(); calcTotals(); collect(); };
    tr.querySelectorAll('input').forEach(i => i.addEventListener('input', ()=>{ calcTotals(); collect(); }));
    ui.linesT.appendChild(tr);
  }

  function calcTotals(){
    let sub = 0;
    ui.linesT.querySelectorAll('tr').forEach(tr=>{
      const price = tr.querySelectorAll('input')[2]?.value || '';
      const n = parseFloat(String(price).replace(/[^\d.]/g,''));
      if (!isNaN(n)) sub += n;
    });
    ui.sub.textContent = money(sub);
    ui.tot.textContent = money(sub); // add taxes/discounts here if needed
  }

  // Photos
  let photos = [];
  function renderPhotos(){
    ui.preview.innerHTML='';
    photos.forEach((file,i)=>{
      const url = URL.createObjectURL(file);
      const cell = document.createElement('div');
      cell.className='relative rounded-lg overflow-hidden border border-white/10';
      cell.innerHTML = `<img src="${url}" class="w-full h-28 object-cover"><button class="absolute top-1 right-1 bg-black/60 text-white text-xs px-2 py-1 rounded">Remove</button>`;
      cell.querySelector('button').onclick = ()=>{ photos.splice(i,1); renderPhotos(); };
      ui.preview.appendChild(cell);
    });
  }
  function compressToDataURL(file, maxW=1600,maxH=1600,q=.82){
    return new Promise(resolve=>{
      const img=new Image(), url=URL.createObjectURL(file);
      img.onload=()=>{
        let w=img.width,h=img.height; const r=Math.min(maxW/w,maxH/h,1); w=Math.round(w*r); h=Math.round(h*r);
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',q));
      }; img.src=url;
    });
  }

  // events
  ['client','phone','email','ref','date','address','services','notes'].forEach(k=>{
    ui[k].addEventListener('input', ()=> collect());
  });
  ui.addRow.addEventListener('click', ()=>{ addRow(); collect(); });

  ui.file.addEventListener('change', e=>{ photos = photos.concat(Array.from(e.target.files||[])); renderPhotos(); });
  ui.add.addEventListener('click', ()=> ui.file.click());
  ui.clear.addEventListener('click', ()=>{ photos=[]; ui.file.value=''; renderPhotos(); });

  ui.gen.addEventListener('click', async ()=>{
    const draft = collect();                             // ensure latest values are saved
    localStorage.setItem('lefties_fos_final', JSON.stringify(draft));
    if (photos.length){
      const dataUrls=[]; for (let f of photos){ dataUrls.push(await compressToDataURL(f)); }
      localStorage.setItem('lefties_jc_photos', JSON.stringify(dataUrls));
    } else {
      localStorage.removeItem('lefties_jc_photos');
    }
    location.href = '/reports/shareable.html?from=fos';
  });

  ui.reset.addEventListener('click', ()=>{
    localStorage.removeItem('lefties_fos_draft');
    localStorage.removeItem('lefties_fos_final');
    localStorage.removeItem('lefties_jc_photos');
    photos=[]; renderPhotos(); hydrate();
  });

  // keep in sync if Field OS above changes
  setInterval(hydrate, 1200);
  hydrate();
})();
</script>
