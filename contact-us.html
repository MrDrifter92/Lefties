<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Lefties Carpet Cleaning</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      color: #e0e0e0;
      background-color: #0f172a;
    }

    /* Background video */
    .video-bg {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      opacity: 0.25; /* adjust transparency here */
    }

    nav {
      display: flex;
      justify-content: center;
      padding: 1rem;
      background: rgba(15, 23, 42, 0.9);
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #e0e0e0;
      font-weight: 600;
    }

    nav a:hover {
      color: #0071B6;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 2rem;
    }

    h1 {
      color: #0071B6;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .contact-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      background: rgba(15, 23, 42, 0.85);
      padding: 2rem;
      border-radius: 10px;
    }

    form {
      flex: 1;
      min-width: 300px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 0.5rem 0;
      border: none;
      border-radius: 6px;
    }

    button {
      background: #0071B6;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .contact-info {
      flex: 1;
      min-width: 300px;
    }

    .contact-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .contact-item img {
      width: 32px;
      height: 32px;
    }

    .warning {
      color: #ff4d4d;
      font-size: 0.85rem;
    }

    .social-links {
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- Background video -->
  <video autoplay muted loop class="video-bg">
    <source src="videos/contact-bg.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <!-- Nav -->
  <nav>
    <a href="index.html">Home</a>
    <a href="carpet-cleaning.html">Carpet Cleaning</a>
    <a href="upholstery-lounges.html">Upholstery & Lounges</a>
    <a href="stain-odour.html">Stain & Odour</a>
    <a href="rug-mattresses.html">Rugs & Mattresses</a>
    <a href="commercial.html">Commercial</a>
    <a href="contact.html" style="color:#0071B6;">Contact Us</a>
  </nav>

  <!-- Content -->
  <div class="container">
    <h1>Get in Touch</h1>
    <div class="contact-wrapper">

      <!-- Form -->
      <form>
        <label>Name</label>
        <input type="text" name="name" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Subject</label>
        <input type="text" name="subject" required>
        <label>Message</label>
        <textarea name="message" rows="5" required></textarea>
        <button type="submit">Send Message</button>
      </form>

      <!-- Contact Info -->
      <div class="contact-info">
        <div class="contact-item">
          <img src="email-icon.png" alt="Email">
          <div>Email Us: <br><strong>Hello@leftiesservices.com.au</strong></div>
        </div>
        <div class="contact-item">
          <img src="facebook-icon.png" alt="Facebook">
          <div><a href="https://www.facebook.com/Lefties.Services" target="_blank">Facebook: Lefties.Services</a></div>
        </div>
        <div class="contact-item">
          <img src="old-facebook-icon.png" alt="Old Facebook">
          <div>
            <a href="https://www.facebook.com/Old.Lefties.Services" target="_blank">Old Facebook Page</a>
            <div class="warning">(Not monitored)</div>
          </div>
        </div>
        <div class="contact-item">
          <img src="instagram-icon.png" alt="Instagram">
          <div><a href="https://www.instagram.com/Lefties.Services" target="_blank">Instagram: Lefties.Services</a></div>
        </div>
        <div class="contact-item">
          <img src="tiktok-icon.png" alt="TikTok">
          <div><a href="https://www.tiktok.com/@Lefties.Services" target="_blank">TikTok: Lefties.Services</a></div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
