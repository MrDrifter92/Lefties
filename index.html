<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lefties Carpet Cleaning | A Spotless Revival | Hervey Bay</title>

  <!-- Tailwind + Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    :root{
      --primary-blue:#0071B6;
      --cream:#F1E8DA;
      --cream-deeper:#E7DAC5;
      --glass-bg:rgba(255,255,255,.40);
      --glass-border:rgba(255,255,255,.28);
      --text:#1c1f23;
      --muted:#3b4652;
    }
    body{
      font-family:'Nunito',sans-serif;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 10% 0%, #fff8ee 0%, var(--cream) 45%, var(--cream-deeper) 100%);
      overflow-x:hidden;
    }

    /* Frosted */
    .frosted{
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 1.25rem;
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      box-shadow: 0 12px 28px rgba(0,0,0,.16), inset 0 1px 1px rgba(255,255,255,.25);
    }
    .hero-location{ color:var(--primary-blue); font-weight:900; }
    .glass-button{
      background: linear-gradient(145deg, rgba(0,148,255,.88), rgba(0,113,182,.94));
      color:#fff; font-weight:800; border-radius:9999px;
      border:1px solid rgba(0,148,255,.35);
      box-shadow: 0 10px 20px rgba(0,113,182,.28), inset 0 1px 1px rgba(255,255,255,.35);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .glass-button:hover{ transform: translateY(-2px); }

    /* Hamburger menu */
    .mobile-menu{ position:fixed; top:0; right:-100%; width:70%; height:100%; background:var(--cream); box-shadow:-4px 0 12px rgba(0,0,0,.2); transition:right .3s ease; padding:2rem; z-index:9999; }
    .mobile-menu.active{ right:0; }
  </style>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-40">
    <nav class="container mx-auto px-4 py-3">
      <div class="frosted px-4 md:px-6 py-3 flex items-center justify-between">
        <img src="Core Logo_transparent .PNG" alt="Lefties Logo" class="h-10 md:h-12 w-auto" />
        <div class="hidden md:flex items-center gap-6 font-extrabold">
          <a href="services.html">Services</a>
          <a href="#gallery">Gallery</a>
          <a href="contact-us.html">Contact</a>
        </div>
        <button id="menu-btn" class="md:hidden text-2xl font-bold">☰</button>
      </div>
    </nav>
  </header>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="mobile-menu">
    <button id="close-btn" class="text-3xl mb-6">×</button>
    <nav class="flex flex-col gap-6 font-extrabold text-lg">
      <a href="services.html">Services</a>
      <a href="#gallery">Gallery</a>
      <a href="contact-us.html">Contact</a>
    </nav>
  </div>

  <!-- ================= HERO ================= -->
  <main>
    <section class="container mx-auto px-4 pt-8">
      <div class="frosted px-5 py-8 text-center">
        <img src="Core Logo_transparent .PNG" alt="Lefties Carpet Cleaning" class="w-36 md:w-48 mx-auto mb-4" />
        <h1 class="text-[42px] md:text-[64px] font-black">
          <span class="hero-location">Hervey Bay.</span>
        </h1>
        <p class="mt-4 text-lg text-[color:var(--muted)]">
          We get the deep-down dirt, stains, and stories out of carpets, rugs, and lounges across Hervey Bay.
        </p>
        <div class="mt-8">
          <a href="#quote" class="glass-button inline-block px-8 py-4 text-lg">Book With Us Today</a>
        </div>
      </div>
    </section>

    <!-- Rest of your site content unchanged ... -->
  </main>

  <footer class="py-10">
    <div class="container mx-auto px-4 text-center">
      <img src="Core Logo_transparent .PNG" alt="Lefties Logo" class="h-10 mx-auto mb-3 opacity-70">
      <p class="text-sm text-[color:var(--muted)]">&copy; 2025 Lefties Carpet Cleaning. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const closeBtn = document.getElementById('close-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    menuBtn.addEventListener('click', ()=> mobileMenu.classList.add('active'));
    closeBtn.addEventListener('click', ()=> mobileMenu.classList.remove('active'));
  </script>
</body>
</html>
