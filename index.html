<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lefties Carpet Cleaning - A Spotless Revival</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background-color: #0f172a;
      color: white;
      text-align: center;
    }
    header {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header img {
      height: 50px;
    }
    header nav a {
      color: white;
      text-decoration: none;
      margin-left: 1rem;
      font-size: 1.2rem;
    }
    .hero {
      background: url('your-background-image.jpg') center/cover no-repeat;
      padding: 5rem 2rem;
    }
    .hero h1 {
      font-size: 3.5rem;
      font-weight: 900;
      margin: 0;
    }
    .hero h2 {
      font-size: 3rem;
      font-weight: 900;
      color: #1E90FF; /* Bright blue */
      text-shadow: 0 0 8px rgba(30, 144, 255, 0.9),
                   0 0 16px rgba(0, 0, 0, 0.8),
                   2px 2px 4px rgba(0, 0, 0, 0.7);
      margin: 0;
    }
    .hero p {
      max-width: 600px;
      margin: 1rem auto 0;
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <img src="core-logo-transparent.png" alt="Lefties Carpet Cleaning Logo">
    <nav>
      <a href="https://facebook.com">Facebook</a>
      <a href="https://instagram.com">Instagram</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Lefties Carpet Cleaning</h1>
    <p style="font-style: italic; font-size: 1.5rem;">A Spotless Revival</p>
    <h2>Hervey<br>Bay.</h2>
    <p>We get the deep-down dirt, stains, and stories out of carpets, rugs, and lounges across Hervey Bay.</p>
  </section>

</body>
</html>
