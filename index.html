  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary-blue:#0071B6;
      --light-blue-glow:rgba(0,140,255,.6);
      --dark-bg:#0D1117;
      --mid-dark-bg:#161B22;
      --light-text:#e5e7eb;
    }
    body{
      font-family:'Nunito',sans-serif;
      background:var(--dark-bg);
      color:var(--light-text);
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .body-video{
      position:fixed; inset:0; width:100vw; height:100vh; object-fit:cover;
      z-index:-3; opacity:.28; transform:translateZ(0);
    }
    .body-tint{
      position:fixed; inset:0; z-index:-2;
      background:linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.25) 35%, rgba(0,0,0,.45));
      pointer-events:none;
    }
    .deep-glass{
      position:relative; overflow:hidden;
      background:linear-gradient(145deg, rgba(30,41,59,.2), rgba(17,24,39,.4));
      border:1px solid rgba(255,255,255,.15);
      border-radius:1.5rem;
      box-shadow:0 0 25px rgba(0,140,255,.1), inset 0 2px 2px rgba(255,255,255,.07), inset 0 -2px 2px rgba(0,0,0,.2);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      transition:all .3s ease;
    }
    .deep-glass::before{
      content:''; position:absolute; top:0; left:-150%; width:75%; height:100%;
      background:linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,.15) 50%, rgba(255,255,255,0) 100%);
      transform:skewX(-25deg); animation:shine 6s infinite linear;
    }
    @keyframes shine{100%{left:150%;}}
    .glass-button{
      background:linear-gradient(145deg, rgba(0,113,182,.6), rgba(0,80,130,.8));
      border:1px solid rgba(0,140,255,.3); border-radius:9999px; color:#fff; font-weight:800;
      text-shadow:0 1px 2px rgba(0,0,0,.4);
      box-shadow:0 0 15px rgba(0,140,255,.2), inset 0 1px 1px rgba(255,255,255,.15);
      transition:all .25s ease;
    }
    .glass-button:hover{ transform:translateY(-3px) scale(1.05); box-shadow:0 0 30px 5px var(--light-blue-glow), inset 0 1px 1px rgba(255,255,255,.2); }
    .bubble-container{ position:absolute; inset:0; overflow:hidden; z-index:0; }
    .bubble{
      position:absolute; border-radius:50%;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.1), rgba(0,140,255,.2));
      box-shadow: inset 0 3px 5px rgba(255,255,255,.05), 0 0 20px rgba(0,140,255,.2);
      animation:float 20s infinite ease-in-out;
    }
    @keyframes float{
      0%{ transform:translateY(10vh) scale(.8); opacity:0; }
      25%{ opacity:.7; }
      50%{ transform:translateY(-15vh) scale(1.1); }
      75%{ opacity:.7; }
      100%{ transform:translateY(-30vh) scale(.9); opacity:0; }
    }
    .mobile-menu-overlay{
      position:fixed; inset:0; background:rgba(13,17,23,.95);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      z-index:90; transform:translateX(100%); transition:transform .5s cubic-bezier(.86,0,.07,1);
    }
    .mobile-menu-overlay[data-state="open"]{ transform:translateX(0); }
    .hamburger-icon{ display:flex; flex-direction:column; justify-content:space-between; width:2rem; height:1.5rem; }
    .hamburger-icon span{ height:2px; width:100%; background:#fff; border-radius:9999px; transition:all .3s; }
    .hamburger-icon.open span:nth-child(1){ transform:translateY(10px) rotate(45deg); }
    .hamburger-icon.open span:nth-child(2){ opacity:0; }
    .hamburger-icon.open span:nth-child(3){ transform:translateY(-10px) rotate(-45deg); }
    .layer-content{ position:relative; z-index:10; }
    .section-video-wrap{ position:relative; overflow:hidden; }
    .section-video{
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      z-index:0; opacity:1;
    }
    .section-video-tint{
      position:absolute; inset:0; z-index:1;
      background:linear-gradient(180deg, rgba(13,17,23,.35), rgba(13,17,23,.15) 35%, rgba(13,17,23,.35));
      pointer-events:none;
    }
    .bg-mid-dark{ background:var(--mid-dark-bg); }
    main{ position:relative; z-index:0; }
  </style>
</head>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuButton = document.getElementById('mobile-menu-button');
      const hamburgerIcon = document.getElementById('hamburger-icon');
      const menuOverlay = document.getElementById('mobile-menu-overlay');

      function openMenu(){
        menuOverlay.setAttribute('data-state','open');
        hamburgerIcon.classList.add('open');
        document.body.style.overflow='hidden';
      }
      function closeMenu(){
        menuOverlay.setAttribute('data-state','closed');
        hamburgerIcon.classList.remove('open');
        document.body.style.overflow='';
      }
      menuButton?.addEventListener('click', ()=> {
        const isOpen = menuOverlay.getAttribute('data-state')==='open';
        isOpen ? closeMenu() : openMenu();
      });
      window.closeMenu = closeMenu;
    });
  </script>
