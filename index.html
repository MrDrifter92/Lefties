<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lefties Carpet Cleaning | A Spotless Revival | Hervey Bay</title>

  <!-- PWA: Icons & Manifest -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128x128.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0071B6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary-blue:#0071B6;
      --light-blue-glow:rgba(0,140,255,.6);
      --dark-bg:#0D1117;
      --mid-dark-bg:#161B22;
      --light-text:#e5e7eb;
    }
    body{
      font-family:'Nunito',sans-serif;
      background:var(--dark-bg);
      color:var(--light-text);
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* ===== Global background video ===== */
    .body-video{
      position:fixed; inset:0; width:100vw; height:100vh; object-fit:cover;
      z-index:-3; opacity:.28; transform:translateZ(0);
    }
    .body-tint{
      position:fixed; inset:0; z-index:-2;
      background:linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.25) 35%, rgba(0,0,0,.45));
      pointer-events:none;
    }

    /* ===== Header ===== */
    .deep-glass{
      position:relative; overflow:hidden;
      background:linear-gradient(145deg, rgba(30,41,59,.2), rgba(17,24,39,.4));
      border:1px solid rgba(255,255,255,.15);
      border-radius:1.5rem;
      box-shadow:0 0 25px rgba(0,140,255,.1), inset 0 2px 2px rgba(255,255,255,.07), inset 0 -2px 2px rgba(0,0,0,.2);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      transition:all .3s ease;
    }
    .deep-glass::before{
      content:''; position:absolute; top:0; left:-150%; width:75%; height:100%;
      background:linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,.15) 50%, rgba(255,255,255,0) 100%);
      transform:skewX(-25deg); animation:shine 6s infinite linear;
    }
    @keyframes shine{100%{left:150%;}}

    .glass-button{
      background:linear-gradient(145deg, rgba(0,113,182,.6), rgba(0,80,130,.8));
      border:1px solid rgba(0,140,255,.3); border-radius:9999px; color:#fff; font-weight:800;
      text-shadow:0 1px 2px rgba(0,0,0,.4);
      box-shadow:0 0 15px rgba(0,140,255,.2), inset 0 1px 1px rgba(255,255,255,.15);
      transition:all .25s ease;
    }
    .glass-button:hover{ transform:translateY(-3px) scale(1.05); box-shadow:0 0 30px 5px var(--light-blue-glow), inset 0 1px 1px rgba(255,255,255,.2); }

    /* Bubbles */
    .bubble-container{ position:absolute; inset:0; overflow:hidden; z-index:0; }
    .bubble{
      position:absolute; border-radius:50%;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.1), rgba(0,140,255,.2));
      box-shadow: inset 0 3px 5px rgba(255,255,255,.05), 0 0 20px rgba(0,140,255,.2);
      animation:float 20s infinite ease-in-out;
    }
    @keyframes float{
      0%{ transform:translateY(10vh) scale(.8); opacity:0; }
      25%{ opacity:.7; }
      50%{ transform:translateY(-15vh) scale(1.1); }
      75%{ opacity:.7; }
      100%{ transform:translateY(-30vh) scale(.9); opacity:0; }
    }

    /* Mobile menu overlay */
    .mobile-menu-overlay{
      position:fixed; inset:0; background:rgba(13,17,23,.95);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      z-index:90; transform:translateX(100%); transition:transform .5s cubic-bezier(.86,0,.07,1);
    }
    .mobile-menu-overlay[data-state="open"]{ transform:translateX(0); }

    /* Hamburger */
    .hamburger-icon{ display:flex; flex-direction:column; justify-content:space-between; width:2rem; height:1.5rem; }
    .hamburger-icon span{ height:2px; width:100%; background:#fff; border-radius:9999px; transition:all .3s; }
    .hamburger-icon.open span:nth-child(1){ transform:translateY(10px) rotate(45deg); }
    .hamburger-icon.open span:nth-child(2){ opacity:0; }
    .hamburger-icon.open span:nth-child(3){ transform:translateY(-10px) rotate(-45deg); }

    .layer-content{ position:relative; z-index:10; }

    /* Hervey Bay text style */
    .hero-location{
      color: var(--primary-blue);
      font-weight: 900;
      letter-spacing: .5px;
      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.6),
        0 0 6px rgba(0, 113, 182, 0.8),
        0 0 16px rgba(0, 140, 255, 0.55),
        0 0 28px rgba(0, 140, 255, 0.4);
    }
    @media (max-width:640px){
      .hero-location{ letter-spacing:.2px; }
    }
  </style>
</head>
<body class="antialiased">

  <!-- Background Video -->
  <video class="body-video" autoplay muted loop playsinline>
    <source src="homepage-video.mp4" type="video/mp4">
  </video>
  <div class="body-tint"></div>

  <!-- HEADER -->
  <!-- … keep your header/nav here exactly as you have it … -->

  <main>
    <section id="home" class="relative pt-32 pb-20 md:pt-48 md:pb-32 overflow-hidden">
      <div class="bubble-container">
        <!-- bubbles -->
      </div>
      <div class="container mx-auto px-6 text-center layer-content">
        <img src="core-logo-transparent.png" alt="Lefties Logo" class="w-80 md:w-[28rem] h-auto mx-auto mb-8">
        <h1 class="text-7xl md:text-7xl font-black text-white leading-tight">
          <span class="hero-location">Hervey Bay.</span>
        </h1>
        <p class="mt-4 text-lg md:text-xl text-gray-300 max-w-3xl mx-auto">
          We get the deep-down dirt, stains, and stories out of carpets, rugs, and lounges across Hervey Bay.
        </p>
        <div class="mt-8">
          <a href="#quote" class="glass-button px-8 py-4 text-lg inline-block">Book With Us Today</a>
        </div>
      </div>
    </section>

    <!-- … keep the rest of your sections as is … -->
  </main>

  <!-- FOOTER -->
  <!-- … keep your footer as is … -->

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuButton = document.getElementById('mobile-menu-button');
      const hamburgerIcon = document.getElementById('hamburger-icon');
      const menuOverlay = document.getElementById('mobile-menu-overlay');

      function openMenu(){
        menuOverlay.setAttribute('data-state','open');
        hamburgerIcon.classList.add('open');
        document.body.style.overflow='hidden';
      }
      function closeMenu(){
        menuOverlay.setAttribute('data-state','closed');
        hamburgerIcon.classList.remove('open');
        document.body.style.overflow='';
      }
      menuButton?.addEventListener('click', ()=> {
        const isOpen = menuOverlay.getAttribute('data-state')==='open';
        isOpen ? closeMenu() : openMenu();
      });
      window.closeMenu = closeMenu;
    });
  </script>
</body>
</html>
