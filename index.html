<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lefties Carpet Cleaning | A Spotless Revival | Hervey Bay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary-blue:#0071B6;
      --light-blue-glow:rgba(0,140,255,.6);
      --dark-bg:#0D1117;
      --mid-dark-bg:#161B22;
      --light-text:#e5e7eb;
    }
    body{
      font-family:'Nunito',sans-serif;
      background:var(--dark-bg);
      color:var(--light-text);
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* ===== Global background video (VERY back) ===== */
    .body-video{
      position:fixed; inset:0; width:100vw; height:100vh; object-fit:cover;
      z-index:-3; opacity:.28; transform:translateZ(0);
    }
    .body-tint{
      position:fixed; inset:0; z-index:-2;
      background:linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.25) 35%, rgba(0,0,0,.45));
      pointer-events:none;
    }

    /* ===== Header (unchanged look) ===== */
    .deep-glass{
      position:relative; overflow:hidden;
      background:linear-gradient(145deg, rgba(30,41,59,.2), rgba(17,24,39,.4));
      border:1px solid rgba(255,255,255,.15);
      border-radius:1.5rem;
      box-shadow:0 0 25px rgba(0,140,255,.1), inset 0 2px 2px rgba(255,255,255,.07), inset 0 -2px 2px rgba(0,0,0,.2);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      transition:all .3s ease;
    }
    .deep-glass::before{
      content:''; position:absolute; top:0; left:-150%; width:75%; height:100%;
      background:linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,.15) 50%, rgba(255,255,255,0) 100%);
      transform:skewX(-25deg); animation:shine 6s infinite linear;
    }
    @keyframes shine{100%{left:150%;}}

    .glass-button{
      background:linear-gradient(145deg, rgba(0,113,182,.6), rgba(0,80,130,.8));
      border:1px solid rgba(0,140,255,.3); border-radius:9999px; color:#fff; font-weight:800;
      text-shadow:0 1px 2px rgba(0,0,0,.4);
      box-shadow:0 0 15px rgba(0,140,255,.2), inset 0 1px 1px rgba(255,255,255,.15);
      transition:all .25s ease;
    }
    .glass-button:hover{ transform:translateY(-3px) scale(1.05); box-shadow:0 0 30px 5px var(--light-blue-glow), inset 0 1px 1px rgba(255,255,255,.2); }

    /* Bubbles */
    .bubble-container{ position:absolute; inset:0; overflow:hidden; z-index:0; }
    .bubble{
      position:absolute; border-radius:50%;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.1), rgba(0,140,255,.2));
      box-shadow: inset 0 3px 5px rgba(255,255,255,.05), 0 0 20px rgba(0,140,255,.2);
      animation:float 20s infinite ease-in-out;
    }
    @keyframes float{
      0%{ transform:translateY(10vh) scale(.8); opacity:0; }
      25%{ opacity:.7; }
      50%{ transform:translateY(-15vh) scale(1.1); }
      75%{ opacity:.7; }
      100%{ transform:translateY(-30vh) scale(.9); opacity:0; }
    }

    /* Mobile menu overlay */
    .mobile-menu-overlay{
      position:fixed; inset:0; background:rgba(13,17,23,.95);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      z-index:90; transform:translateX(100%); transition:transform .5s cubic-bezier(.86,0,.07,1);
    }
    .mobile-menu-overlay[data-state="open"]{ transform:translateX(0); }

    /* Hamburger */
    .hamburger-icon{ display:flex; flex-direction:column; justify-content:space-between; width:2rem; height:1.5rem; }
    .hamburger-icon span{ height:2px; width:100%; background:#fff; border-radius:9999px; transition:all .3s; }
    .hamburger-icon.open span:nth-child(1){ transform:translateY(10px) rotate(45deg); }
    .hamburger-icon.open span:nth-child(2){ opacity:0; }
    .hamburger-icon.open span:nth-child(3){ transform:translateY(-10px) rotate(-45deg); }

    /* Utility to ensure content sits above section videos */
    .layer-content{ position:relative; z-index:10; }

    /* Section backgrounds */
    .bg-mid-dark{ background:var(--mid-dark-bg); }

    /* ===== Hervey Bay headline style ===== */
    .hero-location{
      display:inline-block;
      position:relative;
      font-weight:900;
      letter-spacing:.5px;
      background:linear-gradient(180deg,#7EE6FF 0%, #27C6E6 45%, #00A3CF 70%, #0071B6 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      -webkit-text-stroke:1px rgba(255,255,255,.18);
      text-shadow:
        0 2px 6px rgba(0,113,182,.35),
        0 10px 30px rgba(0,140,255,.25);
      filter: drop-shadow(0 6px 16px rgba(0,140,255,.18));
    }
    .hero-location::before{
      content:"";
      position:absolute; inset:0 0 45% 0;
      background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0));
      -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
      mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
      pointer-events:none;
    }
    .hero-location::after{
      content:"";
      position:absolute; left:50%; transform:translateX(-50%);
      bottom:-0.5rem; width:78%; height:8px; border-radius:9999px;
      background:linear-gradient(90deg, rgba(126,230,255,.0), rgba(126,230,255,.9), rgba(0,113,182,.9), rgba(126,230,255,.0));
      box-shadow:0 6px 18px rgba(0,140,255,.35);
      filter:blur(.2px);
    }
    @media (max-width: 640px){
      .hero-location{ letter-spacing:.2px; }
      .hero-location::after{ width:82%; bottom:-.4rem; height:6px; }
    }
    @media (prefers-reduced-motion: reduce){
      .hero-location, .hero-location::before, .hero-location::after{ animation:none; }
    }
  </style>
</head>
<body class="antialiased">

  <!-- GLOBAL BACKGROUND VIDEO -->
  <video class="body-video" autoplay muted loop playsinline>
    <source src="homepage-video.mp4" type="video/mp4">
  </video>
  <div class="body-tint"></div>

  <!-- HEADER -->
  <!-- (header code unchanged) -->

  <main>
    <!-- HERO -->
    <section id="home" class="relative pt-32 pb-20 md:pt-48 md:pb-32 overflow-hidden">
      <div class="bubble-container">
        <div class="bubble" style="width:50px;height:50px;bottom:10%;left:15%;animation-duration:25s;"></div>
        <div class="bubble" style="width:100px;height:100px;bottom:20%;right:10%;animation-duration:18s;animation-delay:3s;"></div>
        <div class="bubble" style="width:30px;height:30px;bottom:5%;left:40%;animation-duration:30s;animation-delay:1s;"></div>
        <div class="bubble" style="width:80px;height:80px;bottom:30%;left:5%;animation-duration:22s;animation-delay:5s;"></div>
      </div>
      <div class="container mx-auto px-6 text-center layer-content">
        <img src="core-logo-transparent.png" alt="Lefties Logo" class="w-80 md:w-[28rem] h-auto mx-auto mb-8">
        <h1 class="text-7xl md:text-7xl font-black text-white leading-tight">
          <span class="hero-location">Hervey Bay.</span>
        </h1>
        <p class="mt-4 text-lg md:text-xl text-gray-300 max-w-3xl mx-auto">
          We get the deep-down dirt, stains, and stories out of carpets, rugs, and lounges across Hervey Bay.
        </p>
        <div class="mt-8">
          <a href="#quote" class="glass-button px-8 py-4 text-lg inline-block">Book With Us Today</a>
        </div>
      </div>
    </section>

    <!-- rest of your sections exactly as before -->
  </main>

</body>
</html>
