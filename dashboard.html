<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lefties OS - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand-blue: #0071B6;
      --cream-light: #EFE3CF;
      --cream-gradient: linear-gradient(135deg, #F5E9D7, #EFE3CF);
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream-gradient);
      color: #222;
      min-height: 100vh;
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px) saturate(150%);
      -webkit-backdrop-filter: blur(10px) saturate(150%);
      border-radius: 1.25rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .btn {
      background: var(--brand-blue);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 1rem;
      font-weight: 700;
      transition: background 0.2s ease-in-out;
    }
    .btn:hover {
      background: #005a8f;
    }
  </style>
</head>
<body class="p-6">

  <!-- Header -->
  <header class="mb-6 text-center">
    <img src="core-logo-transparent.png" alt="Lefties Logo" class="mx-auto w-32 h-32">
    <h1 class="text-3xl font-extrabold mt-4 text-[var(--brand-blue)]">Lefties OS</h1>
    <p class="text-lg">A Spotless Revival</p>
  </header>

  <!-- Dashboard Cards -->
  <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="glass p-6">
      <h2 class="text-xl font-bold text-[var(--brand-blue)] mb-2">Jobs</h2>
      <p class="mb-4">View and manage your booked jobs for the week.</p>
      <a href="jobs.html" class="btn">Open</a>
    </div>

    <div class="glass p-6">
      <h2 class="text-xl font-bold text-[var(--brand-blue)] mb-2">Chemicals</h2>
      <p class="mb-4">Check your chemical reference and safety notes.</p>
      <a href="chemicals.html" class="btn">Open</a>
    </div>

    <div class="glass p-6">
      <h2 class="text-xl font-bold text-[var(--brand-blue)] mb-2">Pricing</h2>
      <p class="mb-4">Quick reference for your price guide.</p>
      <a href="pricing.html" class="btn">Open</a>
    </div>

    <div class="glass p-6">
      <h2 class="text-xl font-bold text-[var(--brand-blue)] mb-2">Binder</h2>
      <p class="mb-4">Access your iPad-ready reference binder.</p>
      <a href="binder.html" class="btn">Open</a>
    </div>
  </main>

</body>
</html>
