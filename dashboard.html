<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Lefties OS — Dashboard</title>

  <!-- Light PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#EFE3CF">

  <!-- Icons already in your repo root -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="manifest" href="/icons/manifest.webmanifest">

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --brand-blue:#0071B6;
      --cream-1:#EFE3CF;
      --cream-2:#F7ECD9;
    }
    html,body{height:100%}
    body{
      font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      /* respect iOS safe areas */
      padding-top: calc(env(safe-area-inset-top) + 8px);
      padding-left:  env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: calc(env(safe-area-inset-bottom));
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(215,175,255,.18), transparent 60%),
        radial-gradient(1200px 600px at 120% 110%, rgba(0,113,182,.14), transparent 60%),
        linear-gradient(180deg, var(--cream-2), var(--cream-1));
      color:#222;
    }
    .glass{
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.75);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .tile{
      background: rgba(255,255,255,.86);
      border:1px solid rgba(255,255,255,.85);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
    }
    .btn{
      display:inline-block;
      background: var(--brand-blue);
      color:#fff; font-weight:800;
      padding:.8rem 1.2rem; border-radius:18px;
    }
  </style>
</head>
<body>

  <!-- Top bar (compact, safe-area aware) -->
  <header class="glass mx-4 mb-4 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="/core-logo-transparent.png" alt="Lefties" class="h-8 w-8 object-contain select-none">
      <div class="text-lg font-extrabold text-[var(--brand-blue)]">Lefties OS</div>
      <span class="ml-2 px-2.5 py-0.5 rounded-full text-[10px] font-black"
            style="background:#e9f2fb;color:#0f3f66;">LeftiesLite</span>
    </div>
    <div id="now" class="text-sm font-extrabold text-slate-700"></div>
  </header>

  <!-- Cards -->
  <main class="mx-4 pb-8 space-y-4">
    <section class="tile">
      <h2 class="text-xl font-extrabold text-[var(--brand-blue)] mb-1">Jobs</h2>
      <p class="mb-4 text-slate-700">View and manage your booked jobs for the week.</p>
      <a class="btn" href="/jobs.html">Open</a>
    </section>

    <section class="tile">
      <h2 class="text-xl font-extrabold text-[var(--brand-blue)] mb-1">Chemicals</h2>
      <p class="mb-4 text-slate-700">Check your chemical reference and safety notes.</p>
      <a class="btn" href="/chemicals.html">Open</a>
    </section>

    <section class="tile">
      <h2 class="text-xl font-extrabold text-[var(--brand-blue)] mb-1">Pricing</h2>
      <p class="mb-4 text-slate-700">Quick reference for your price guide.</p>
      <a class="btn" href="/pricing.html">Open</a>
    </section>

    <section class="tile">
      <h2 class="text-xl font-extrabold text-[var(--brand-blue)] mb-1">Binder</h2>
      <p class="mb-4 text-slate-700">Access your iPad-ready reference binder.</p>
      <a class="btn" href="/binder.html">Open</a>
    </section>

    <footer class="text-center pt-2 text-slate-500">
      <a href="/" class="inline-block glass px-5 py-2 rounded-full font-bold">leftiesservices.com.au</a>
    </footer>
  </main>

  <script>
    // clock
    const el = document.getElementById('now');
    const fmt = new Intl.DateTimeFormat('en-AU', {
      weekday:'short', day:'2-digit', month:'short',
      hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Australia/Brisbane'
    });
    function tick(){ if(el) el.textContent = fmt.format(new Date()); }
    tick(); setInterval(tick, 30000);
  </script>
</body>
</html>
